name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ki -e toss -e 'core[push]'
      - name: Unit tests (API 키 없이 실행)
        run: |
          python -m unittest discover -s core/tests -q
          python -m unittest discover -s ki/tests -q
          python -m unittest discover -s toss/tests -q
          python -m unittest discover -s deploy -p 'test_*.py' -q
      - name: Demo commands
        run: |
          core brokers
          core guard policy
          ai-manager --data-dir ./data/demo reports --json

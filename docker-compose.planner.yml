# Explicit opt-in research gateway; receives thesis and judgment requests.
name: ai-manager-reports
services:
  report-worker:
    environment:
      AI_MANAGER_PLANNER_ENABLED: "true"
  planner:
    build:
      context: ./mind
      dockerfile: Dockerfile.codex
    # report-worker와 같은 비root UID로 실행해 스풀 파일을 서로 읽고 쓴다.
    user: "${AI_MANAGER_UID:-10001}:${AI_MANAGER_GID:-10001}"
    environment:
      AGENT_ROLE: judge
      HOME: /work
      CODEX_HOME: /home/agent/.codex
      SPOOL_DIR: /spool
      POLL_INTERVAL: "2"
    volumes:
      - ./secrets/codex-planner:/home/agent/.codex:rw
      - ./core/data/manager/spool:/spool:rw
      - ./mind/prompts:/prompts:ro
      - ./mind/schema:/schema:ro
    read_only: true
    tmpfs:
      - /tmp
      - /work:mode=700,uid=${AI_MANAGER_UID:-10001},gid=${AI_MANAGER_GID:-10001}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [planner]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
networks:
  planner:

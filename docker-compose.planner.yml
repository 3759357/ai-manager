# Explicit opt-in research gateway; receives thesis and judgment requests.
name: ai-manager-reports
services:
  report-worker:
    environment:
      AI_MANAGER_PLANNER_ENABLED: "true"
  planner:
    build:
      context: ./mind
      dockerfile: Dockerfile.codex
    user: "0:0"
    environment:
      AGENT_ROLE: judge
      CODEX_HOME: /home/agent/.codex
      SPOOL_DIR: /spool
      POLL_INTERVAL: "2"
    volumes:
      - ./secrets/codex-planner:/home/agent/.codex:rw
      - ./core/data/manager/spool:/spool:rw
      - ./mind/prompts:/prompts:ro
      - ./mind/schema:/schema:ro
    read_only: true
    tmpfs:
      - /tmp
      - /work:mode=700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [planner]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
networks:
  planner:

# 리스크관리부 정책 v1. 기준: 제품 기획의 리스크관리·트레이딩 데스크 한도, 비중 규칙 v1.
# 비율은 퍼센트(%) 숫자, 손실 한도는 음수로 적는다.
# 모든 키가 필요하다. 빠진 값은 "무제한 허용"이 아니라 정책 오류로 거절한다.
# 이 파일은 사용자의 명시적 변경으로만 바꾸며, 바꿀 때 version을 올린다.

version = "v1"

[account]
min_cash_pct = 20                 # 현금 하한(주식 상한 80%)
emergency_drawdown_pct = -15      # 1년 롤링 고점 대비 계좌 낙폭. 이하면 신규 매수 전면 중지
max_account_snapshot_age_seconds = 300

[order]
limit_only = true
max_quote_age_seconds = 30
max_mid_deviation_pct = 1.0       # 지정가가 호가 중간값에서 벗어날 수 있는 범위
# 아래 두 값은 운용자가 확정한다. 기본값은 토스 실주문 상한과 같은 보수적 값이다.
max_order_usd = 1500
max_daily_buy_usd = 1500

[position]
max_single_pct = 15               # 두 장부 합산 단일 종목
max_single_high_vol_pct = 10      # 연 변동성이 아래 기준을 넘는 종목
high_vol_annual_pct = 45
max_single_before_earnings_pct = 7
max_leveraged_effective_pct = 10  # 계좌 대비 레버리지 상품 실효 노출(평가액 × 배수)

[trading_book]
max_trade_loss_pct = 1            # 거래 1건 최대 손실(진입가~손절가 × 수량), 트레이딩북 대비
strategy_daily_loss_pct = -2
book_daily_loss_pct = -3
strategy_monthly_loss_pct = -6
book_drawdown_pct = -15
max_hold_days = 10

[alerts]
market_drop_pct = [-3, -5, -7]    # QQQ 전일 종가 대비 장중
account_daily_drop_pct = [-3, -5]
holding_move_pct = 7
heartbeat_stale_minutes = 10
